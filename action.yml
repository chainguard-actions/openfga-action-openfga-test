name: 'OpenFGA Model Testing Action'
description: 'Github Action for testing your OpenFGA Authorization Model'
branding:
  icon: 'align-center'
  color: 'green'
inputs:
  test_path:
    description: 'Path to the test file or folder'
    required: false
    default: '.'
  test_files_pattern:
    description: 'Pattern to match the test files'
    required: false
    default: '*.fga.yaml'
  fga_server_url:
    description: 'The OpenFGA server to test the Authorization Model against. If not provided, the tests will be run using the cli built-in OpenFGA instance.'
    required: false
    default: ''
  fga_server_store_id:
    description: 'The OpenFGA server store id. Must be provided if fga_server_url is configured.'
    required: false
    default: ''
  fga_api_token:
    description: 'The api token to use for testing against an OpenFGA server. Ignored if fga_server_url is not provided.'
    required: false
    default: ''
  fga_cli_version:
    description: 'Version tag of openfga/cli to use'
    required: false
    default: latest
  fga_cli_allow_external_files:
    description: 'Enable OpenFGA cli --allow-external-files flag.'
    required: false
    default: false
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Install OpenFGA CLI
      uses: chainguard-actions/jaxxstorm-action-install-gh-release@ce63271258ce8271a4caf20ba907536f30031a84 # v3.0.0
      with:
        repo: openfga/cli
        tag: ${{ inputs.fga_cli_version }}
        cache: enable
    - uses: chainguard-actions/chrisdickinson-setup-yq@082e6bb1a1e8376cf1a3a2e8c6a75b050974824a # v1.0.0
      with:
        yq-version: v4.25.3
    - name: Run OpenFGA CLI
      shell: bash
      env:
        FGA_CLI_ALLOW_EXTERNAL_FILES: ${{ inputs.fga_cli_allow_external_files }}
        FGA_SERVER_URL: ${{ inputs.fga_server_url }}
        FGA_SERVER_STORE_ID: ${{ inputs.fga_server_store_id }}
        FGA_API_TOKEN: ${{ inputs.fga_api_token }}
        TEST_PATH: ${{ inputs.test_path }}
        TEST_FILES_PATTERN: ${{ inputs.test_files_pattern }}
      run: |-
        while IFS= read -r -d '' test_file
        do
          ((test_files_count+=1))

          allow_external_files=""
          if [[ "$FGA_CLI_ALLOW_EXTERNAL_FILES" == "true" ]]; then
            allow_external_files="--allow-external-files"
          fi

          if [[ -z "$FGA_SERVER_URL" ]]; then
            echo "Running FGA test file ${test_file}"
            fga model test ${allow_external_files:+"$allow_external_files"} --tests "${test_file}"
          else
            echo "Running FGA test file ${test_file} against OpenFGA server $FGA_SERVER_URL"
            fga_token="$FGA_API_TOKEN"
            test_file_dir=$(dirname -- "${test_file}")
            test_file_base=$(basename -- "${test_file}")
            test_file_without_model=$(mktemp -- "${test_file_dir}/${test_file_base}.XXXXXX")
            trap 'rm -f "${test_file_without_model}"' EXIT
            yq 'del(.model_file, .model)' -- "${test_file}" > "${test_file_without_model}"
            fga model test \
              ${allow_external_files:+"$allow_external_files"} \
              --api-url "$FGA_SERVER_URL" \
              --store-id "$FGA_SERVER_STORE_ID" \
              ${fga_token:+--api-token "$fga_token"} \
              --tests "${test_file_without_model}"
            rm -f "${test_file_without_model}"
            trap - EXIT
          fi

        done <   <(find "$TEST_PATH" -name "$TEST_FILES_PATTERN" -print0)

        if [[ ${test_files_count} -eq 0 ]]; then
          echo "No FGA test file found for path '$TEST_PATH' and pattern '$TEST_FILES_PATTERN'"
          exit 1
        fi
