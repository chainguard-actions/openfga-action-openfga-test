name: Test basic passing directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          test_path: tests/fixtures/passing
      - name: Assert step succeeded and fga CLI is installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v fga >/dev/null 2>&1; then
            echo "FAIL: fga CLI not on PATH"
            exit 1
          fi
          fga version || true
          echo "PASS"
