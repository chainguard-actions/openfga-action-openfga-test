name: Test basic OpenFGA model testing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OpenFGA model tests
        id: action
        uses: .
        with:
          test_path: tests/fixtures/basic
          test_files_pattern: '*.fga.yaml'
      - name: Assert tests passed
        run: |
          echo "PASS: OpenFGA model tests completed successfully"
