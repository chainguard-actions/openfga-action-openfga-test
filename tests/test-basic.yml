name: Test basic OpenFGA model testing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OpenFGA model test action
        id: action
        uses: .
        with:
          test_path: ${{ github.workspace }}/tests/fixtures
          test_files_pattern: '*.fga.yaml'
      - name: Assert action succeeded
        run: |
          echo "Action completed successfully"
          echo "PASS"
