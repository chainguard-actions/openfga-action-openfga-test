name: Test custom test path and file pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run OpenFGA model tests with custom path and pattern
        uses: .
        with:
          test_path: ./tests/fixtures/custom-tests
          test_files_pattern: '*.test.yaml'

      - name: Assert action succeeded with custom path and pattern
        run: |
          echo "PASS: OpenFGA model tests completed successfully with custom path and pattern"
