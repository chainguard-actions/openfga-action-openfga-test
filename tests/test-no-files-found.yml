name: Test no test files found error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OpenFGA model tests with non-matching pattern
        id: action
        uses: .
        with:
          test_path: tests/fixtures/basic
          test_files_pattern: '*.nonexistent'
        continue-on-error: true
      - name: Assert action failed when no files found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no test files are found, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no test files matched the pattern"
