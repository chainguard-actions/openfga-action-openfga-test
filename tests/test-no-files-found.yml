name: Test no test files found - should fail gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty directory with no matching files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/empty-fga-dir"
          echo "not a test file" > "$GITHUB_WORKSPACE/empty-fga-dir/readme.txt"

      - id: action
        name: Run OpenFGA model tests (expect failure - no files)
        uses: .
        continue-on-error: true
        with:
          test_path: ./empty-fga-dir
          test_files_pattern: '*.fga.yaml'

      - name: Assert action failed with no files found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no test files were found"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when no test files were found"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
