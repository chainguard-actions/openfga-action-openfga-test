name: Test OpenFGA model testing with inline model
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OpenFGA model test action with inline model store file
        id: action
        uses: .
        with:
          store-file-path: ${{ github.workspace }}/tests/fixtures/inline/store.fga.yaml
      - name: Assert action succeeded
        run: |
          echo "OpenFGA inline model test action completed successfully"
          echo "PASS: action ran without errors using inline model"
